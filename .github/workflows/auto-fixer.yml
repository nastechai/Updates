name: "Auto System Fixer Bot"

on:
  workflow_run:
    workflows:
      - "Stage Pipeline: ordered promote → main → nastech-agent PR"
      - "Hermes Sync → hermes-upstream (always up to date)"
      - "Sync Stream Bot — always watch for new commits"
      - "Brand Discussion — owner approval + answers"
      - "Stage 1: Hermes Automation → Verify (PR)"
      - "Stage 2: Verify → Semi-Stage (PR)"
      - "Stage 3: Semi-Stage → Final (PR)"
      - "Stage 4: Final → Production PR (nastech-agent)"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download Failure Artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            const matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "failure-report"
            })[0];
            if (matchArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 artifact_id: matchArtifact.id,
                 archive_format: 'zip',
              });
              const fs = require('fs');
              fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/failure-report.zip`, Buffer.from(download.data));
            }

      - name: Unzip Failure Report
        run: |
          if [ -f failure-report.zip ]; then
            unzip failure-report.zip
          else
            echo "No failure report artifact found."
            exit 0
          fi

      - name: Resolve PR number from failing branch
        uses: actions/github-script@v9
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const branch = process.env.HEAD_BRANCH;
            if (!branch) return;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (prs.length > 0) {
              require('fs').appendFileSync(process.env.GITHUB_ENV, `PR_NUMBER=${prs[0].number}\n`);
              require('fs').appendFileSync(process.env.GITHUB_ENV, `RUN_ID=${context.payload.workflow_run.id}\n`);
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Auto Fixer Agent (ensemble)
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          RUN_ID: ${{ env.RUN_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAS_TOKEN: ${{ secrets.NAS_TOKEN }}
          OLLAMA_API_KEY_1: ${{ secrets.OLLAMA_API_KEY_1 }}
          OLLAMA_API_KEY_2: ${{ secrets.OLLAMA_API_KEY_2 }}
          OLLAMA_API_KEY_3: ${{ secrets.OLLAMA_API_KEY_3 }}
          OLLAMA_API_KEY_4: ${{ secrets.OLLAMA_API_KEY_4 }}
          OLLAMA_API_KEY_5: ${{ secrets.OLLAMA_API_KEY_5 }}
          OLLAMA_API_KEY_6: ${{ secrets.OLLAMA_API_KEY_6 }}
          OLLAMA_API_KEY_7: ${{ secrets.OLLAMA_API_KEY_7 }}
          OLLAMA_API_KEY_8: ${{ secrets.OLLAMA_API_KEY_8 }}
          OLLAMA_API_KEY_9: ${{ secrets.OLLAMA_API_KEY_9 }}
          OLLAMA_API_KEY_10: ${{ secrets.OLLAMA_API_KEY_10 }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python .github/scripts/fixer_agent.py --mode pr-fail
          else
            echo "No open PR found for failing branch; skipping auto-fix."
          fi
