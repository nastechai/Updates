name: "Stage 1: Hermes Automation → Verify (PR)"

on:
  push:
    branches:
      - hermes-automation
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr-to-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hermes-automation
        uses: actions/checkout@v4
        with:
          ref: hermes-automation
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Ensure verify branch exists and is up to date
        run: |
          git fetch origin
          if git ls-remote --exit-code origin verify; then
            git checkout -B verify origin/verify
          else
            git checkout -B verify
          fi
          # Merge hermes-automation into verify (no fast-forward, keep history)
          git merge --no-ff origin/hermes-automation -m "chore(stage1): merge hermes-automation into verify [auto]" || true
          git push origin verify --force-with-lease || git push origin verify

      - name: Create or update PR from verify → semi-stage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = 'verify';
            const base = 'semi-stage';

            // Ensure base branch exists
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: base });
            } catch {
              // Create base from verify if it doesn't exist
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${head}` });
              await github.rest.git.createRef({
                owner, repo,
                ref: `refs/heads/${base}`,
                sha: ref.data.object.sha
              });
              console.log(`Created branch ${base}`);
            }

            // Check for existing open PR
            const prs = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${head}`, base, state: 'open'
            });

            let pr;
            if (prs.data.length > 0) {
              pr = prs.data[0];
              console.log(`Existing PR found: ${pr.html_url}`);
            } else {
              pr = (await github.rest.pulls.create({
                owner, repo,
                title: `chore(stage1): verify → semi-stage [auto]`,
                head,
                base,
                body: `## Stage 1 → Stage 2 Auto-PR\n\nAutomatically opened by the Stage 1 workflow after merging \`hermes-automation\` into \`verify\`.\n\n> **Note:** \`main\` is never touched by this pipeline.`,
              })).data;
              console.log(`PR created: ${pr.html_url}`);
            }

            // Auto-merge the PR
            try {
              await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `chore(stage1): verify → semi-stage [auto-merge]`
              });
              console.log('PR auto-merged successfully');
            } catch (e) {
              console.log(`Auto-merge skipped or failed: ${e.message}`);
            }
