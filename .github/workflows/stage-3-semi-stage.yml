name: "Stage 3: Semi-Stage → Final (PR)"

on:
  push:
    branches:
      - semi-stage
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  orchestrate-semi-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout semi-stage branch
        uses: actions/checkout@v4
        with:
          ref: semi-stage
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Run Orchestrator (Semi-Stage)
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py .github/scripts/*.js 2>/dev/null || true
          ./.github/scripts/branding-orchestrator.sh . semi-stage

      - name: Commit semi-stage artifacts
        run: |
          git add -A
          git commit -m "chore(stage3): branding semi-stage transformation [auto]" || echo "Nothing to commit"
          git push origin semi-stage

      - name: Upload Stage Report
        uses: actions/upload-artifact@v4
        with:
          name: semi-stage-report
          path: STAGE_REPORT.md

  open-pr-to-final:
    needs: orchestrate-semi-stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout semi-stage
        uses: actions/checkout@v4
        with:
          ref: semi-stage
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Ensure final branch exists
        run: |
          git fetch origin
          if git ls-remote --exit-code origin final; then
            echo "final already exists"
          else
            git checkout -B final
            git push origin final
          fi

      - name: Create or update PR semi-stage → final
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = 'semi-stage';
            const base = 'final';

            const prs = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${head}`, base, state: 'open'
            });

            let pr;
            if (prs.data.length > 0) {
              pr = prs.data[0];
              console.log(`Existing PR: ${pr.html_url}`);
            } else {
              pr = (await github.rest.pulls.create({
                owner, repo,
                title: `chore(stage3): semi-stage → final [auto]`,
                head,
                base,
                body: `## Stage 3 Auto-PR\n\nSemi-stage transformation complete. Promoting to \`final\`.\n\n> **main is never touched by this pipeline.**`,
              })).data;
              console.log(`PR created: ${pr.html_url}`);
            }

            try {
              await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `chore(stage3): semi-stage → final [auto-merge]`
              });
              console.log('PR auto-merged');
            } catch (e) {
              console.log(`Auto-merge skipped: ${e.message}`);
            }
