name: "Stage 3: Verify to Semi-Stage"

on:
  push:
    branches:
      - verify
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semi-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Verify branch
        uses: actions/checkout@v4
        with:
          ref: verify
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Run Orchestrator (Semi-Stage Stage)
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py .github/scripts/*.js
          ./.github/scripts/branding-orchestrator.sh . semi-stage
          
      - name: Commit and Push to Semi-Stage
        run: |
          git checkout -B semi-stage
          git add -A
          git commit -m "chore: branding semi-stage transformation (npm, docker, config)" || echo "No changes to commit"
          git push origin semi-stage --force

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: semi-stage-report
          path: STAGE_REPORT.md
