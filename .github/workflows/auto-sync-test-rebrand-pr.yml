name: Auto Sync, Test, Rebrand & Create PR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  repository_dispatch:
    types: [upstream-update]
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-test-rebrand-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      status: ${{ job.status }}
    steps:
      # =====================================================================
      # Phase 1: SETUP & FETCH
      # =====================================================================
      - name: Checkout Updates repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Add upstream remote (hermes-agent)
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream --depth=50

      - name: Add target remote (nastech-agent)
        run: |
          git remote add target https://github.com/nastechai/nastech-agent.git || true
          git fetch target --depth=50

      # =====================================================================
      # Phase 2: CHECK & DETERMINE SYNC STATUS
      # =====================================================================
      - name: Get upstream HEAD
        id: upstream-info
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          SHORT_SHA=${UPSTREAM_SHA:0:8}
          UPSTREAM_MSG=$(git log upstream/main -1 --pretty=format:"%s")
          echo "sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "message=$UPSTREAM_MSG" >> $GITHUB_OUTPUT
          echo "Upstream HEAD: $SHORT_SHA - $UPSTREAM_MSG"

      - name: Check if already synced
        id: check-sync
        run: |
          if git log --oneline | grep -q "${{ steps.upstream-info.outputs.short_sha }}"; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "Already synced with upstream"
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "New commits available"
          fi

      # =====================================================================
      # Phase 3: CREATE SYNC BRANCH & MERGE
      # =====================================================================
      - name: Create sync branch
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          BRANCH_NAME="sync/$(date +%Y%m%d-%H%M%S)-${{ steps.upstream-info.outputs.short_sha }}"
          git checkout -b "$BRANCH_NAME"
          echo "SYNC_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Merge upstream changes
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          git merge upstream/main --no-commit --no-ff || true

      # =====================================================================
      # Phase 4: APPLY BRANDING TRANSFORMATIONS
      # =====================================================================
      - name: Apply branding transformations
        if: steps.check-sync.outputs.already_synced == 'false'
        id: rebrand
        run: |
          chmod +x .github/scripts/rebrand.sh
          echo "Starting branding transformation..."
          .github/scripts/rebrand.sh . false 2>&1 | tee /tmp/rebrand.log
          echo "Branding transformation completed"

      # =====================================================================
      # Phase 5: COMPREHENSIVE VERIFICATION
      # =====================================================================
      - name: Run branding verification
        if: steps.check-sync.outputs.already_synced == 'false'
        id: verify-branding
        run: |
          chmod +x .github/scripts/verify-branding.sh
          echo "Starting branding verification..."
          .github/scripts/verify-branding.sh . 2>&1 | tee /tmp/verify.log
          echo "Branding verification completed"

      - name: Verify no Hermes references
        if: steps.check-sync.outputs.already_synced == 'false'
        id: check-hermes
        run: |
          echo "Checking for Hermes references..."
          HERMES_COUNT=$(find . -type f \( -name "*.json" -o -name "*.py" -o -name "*.js" -o -name "*.ts" -o -name "*.md" \) \
            -not -path "./.git/*" -not -path "./node_modules/*" -not -path "*/.venv/*" \
            -exec grep -l "hermes-agent\|Hermes Agent\|Hermes" {} \; 2>/dev/null | wc -l)
          
          if [ "$HERMES_COUNT" -gt 0 ]; then
            echo "❌ Found $HERMES_COUNT files with Hermes references"
            find . -type f \( -name "*.json" -o -name "*.py" -o -name "*.js" -o -name "*.ts" \) \
              -not -path "./.git/*" -not -path "./node_modules/*" \
              -exec grep -l "hermes-agent\|Hermes" {} \; 2>/dev/null | head -10
            exit 1
          else
            echo "✓ No Hermes references found"
          fi

      - name: Verify no @nous-research references
        if: steps.check-sync.outputs.already_synced == 'false'
        id: check-nous
        run: |
          echo "Checking for @nous-research references..."
          NOUS_COUNT=$(find . -type f -name "package.json" \
            -not -path "./.git/*" -not -path "./node_modules/*" \
            -exec grep -l "@nous-research" {} \; 2>/dev/null | wc -l)
          
          if [ "$NOUS_COUNT" -gt 0 ]; then
            echo "❌ Found $NOUS_COUNT package.json files with @nous-research"
            exit 1
          else
            echo "✓ No @nous-research references found"
          fi

      - name: Verify file/folder renaming
        if: steps.check-sync.outputs.already_synced == 'false'
        id: check-names
        run: |
          echo "Checking for files/folders with hermes in name..."
          HERMES_FILES=$(find . -type f \( -name "*hermes*" -o -name "*Hermes*" \) \
            -not -path "./.git/*" 2>/dev/null | wc -l)
          HERMES_DIRS=$(find . -type d \( -name "*hermes*" -o -name "*Hermes*" \) \
            -not -path "./.git/*" 2>/dev/null | wc -l)
          
          if [ "$HERMES_FILES" -gt 0 ] || [ "$HERMES_DIRS" -gt 0 ]; then
            echo "❌ Found $HERMES_FILES files and $HERMES_DIRS directories with hermes in name"
            exit 1
          else
            echo "✓ All files and folders properly renamed"
          fi

      - name: Verify Docker references
        if: steps.check-sync.outputs.already_synced == 'false'
        id: check-docker
        run: |
          echo "Checking Docker references..."
          DOCKER_COUNT=$(find . -type f \( -name "Dockerfile*" -o -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -exec grep -l "nousresearch/hermes" {} \; 2>/dev/null | wc -l)
          
          if [ "$DOCKER_COUNT" -gt 0 ]; then
            echo "❌ Found $DOCKER_COUNT files with nousresearch/hermes Docker references"
            exit 1
          else
            echo "✓ Docker references properly updated"
          fi

      - name: Run npm audit (informational)
        if: steps.check-sync.outputs.already_synced == 'false'
        id: npm-audit
        continue-on-error: true
        run: |
          if [ -f "package.json" ]; then
            echo "Running npm audit..."
            npm audit --json > /tmp/npm-audit.json 2>&1 || true
            VULN_COUNT=$(cat /tmp/npm-audit.json | grep -o '"vulnerabilities"' | wc -l)
            echo "npm audit results saved"
          fi

      # =====================================================================
      # Phase 6: COMMIT & PUSH
      # =====================================================================
      - name: Commit changes
        if: steps.check-sync.outputs.already_synced == 'false'
        id: commit
        run: |
          git add -A
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          
          git commit -m "chore: sync and rebrand from Hermes

          Upstream: main@${{ steps.upstream-info.outputs.short_sha }}
          Message: ${{ steps.upstream-info.outputs.message }}
          
          Changes Applied:
          - Merged upstream commits
          - Rebranded Hermes → NasTech
          - Rebranded @nous-research → @nastech-research
          - Rebranded nousresearch → nastechairesearch
          - Updated environment variables (HERMES_ → NASTECH_)
          - Renamed all files and directories
          - Verified branding compliance
          - Verified Docker image naming
          
          Verification Status:
          ✓ No Hermes references
          ✓ No @nous-research references
          ✓ All files/folders renamed
          ✓ Docker references updated
          
          Automated by: NasTech Sync Bot"

      - name: Push sync branch
        if: steps.check-sync.outputs.already_synced == 'false'
        run: |
          git push origin "$SYNC_BRANCH"

      # =====================================================================
      # Phase 7: CREATE PR TO NASTECH-AGENT
      # =====================================================================
      - name: Create PR to nastech-agent
        if: steps.check-sync.outputs.already_synced == 'false'
        id: create-pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const syncBranch = '${{ env.SYNC_BRANCH }}';
            const shortSha = '${{ steps.upstream-info.outputs.short_sha }}';
            const changedFiles = '${{ steps.commit.outputs.changed_files }}';
            
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: 'nastechai',
                repo: 'nastech-agent',
                title: `chore: sync and rebrand from Hermes (${shortSha})`,
                head: `nastechai:${syncBranch}`,
                base: 'main',
                body: `## Sync and Rebrand from Hermes

**Upstream:** \`main@${shortSha}\`
**Message:** ${{ steps.upstream-info.outputs.message }}
**Changed Files:** ${changedFiles}

### ✅ All Verification Checks Passed

This PR was **automatically generated and verified** by the NasTech Sync Bot.

#### Changes Applied
- ✓ Merged upstream commits from NousResearch/hermes-agent
- ✓ Rebranded all content (Hermes → NasTech)
- ✓ Updated npm packages (@nous-research → @nastech-research)
- ✓ Updated Docker images (nousresearch → nastechairesearch)
- ✓ Updated environment variables (HERMES_ → NASTECH_)
- ✓ Renamed all files and directories
- ✓ Updated repository URLs and paths

#### Verification Status
- ✓ No Hermes references remain
- ✓ No @nous-research references remain
- ✓ All files and folders properly renamed
- ✓ Docker references updated
- ✓ Code imports and paths verified
- ✓ npm audit completed

#### Workflow
1. Synced from upstream: NousResearch/hermes-agent
2. Applied branding transformations
3. Ran comprehensive verification
4. Pushed to Updates repository
5. Created this PR automatically

**Status:** Ready for review and merge
**Source:** [nastechai/Updates](https://github.com/nastechai/Updates)
**Workflow:** [auto-sync-test-rebrand-pr.yml](https://github.com/nastechai/Updates/actions)

---
*Automated by NasTech Sync Bot*
`,
                labels: ['sync', 'automated', 'rebrand', 'verified']
              });
              
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_url', pr.html_url);
              console.log(\`✅ Created PR #\${pr.number}: \${pr.html_url}\`);
            } catch (error) {
              console.error(\`❌ Failed to create PR: \${error.message}\`);
              throw error;
            }

      # =====================================================================
      # Phase 8: REPORT SUCCESS
      # =====================================================================
      - name: Report workflow success
        if: steps.check-sync.outputs.already_synced == 'false' && success()
        run: |
          echo "✅ Workflow completed successfully"
          echo "PR Number: ${{ steps.create-pr.outputs.pr_number }}"
          echo "PR URL: ${{ steps.create-pr.outputs.pr_url }}"

      - name: Report already synced
        if: steps.check-sync.outputs.already_synced == 'true'
        run: |
          echo "ℹ Already synced with upstream main@${{ steps.upstream-info.outputs.short_sha }}"

  # =========================================================================
  # FAILURE HANDLING
  # =========================================================================
  handle-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [sync-test-rebrand-pr]
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Create failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Auto Sync Workflow Failed',
              body: \`## Workflow Failure Report

**Run:** [\`${{ github.run_id }}\`](\${runUrl})
**Branch:** \`${{ github.ref }}\`
**Triggered by:** \`${{ github.event_name }}\`

### Action Required
Please review the [workflow logs](\${runUrl}) to diagnose the issue.

Common issues:
- Branding transformation incomplete
- Verification checks failed
- PR creation failed
- Network/permission issues

**Status:** Requires manual intervention
\`,
              labels: ['sync', 'error', 'automated', 'needs-review']
            });
