name: "Release Request — brand plan + npm parity"

# Reads RELEASE_REQUEST.md (the branding master config). When the owner edits
# it, this workflow re-analyses the full brand plan (all brands, categorized),
# compares hermes vs nastech npm packages, and — if they do not match — opens
# a Discussion with the exact update + publish steps. No spam when parity is OK.

on:
  push:
    branches:
      - main
    paths:
      - 'RELEASE_REQUEST.md'
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: write

jobs:
  analyse-release-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run release-request analyzer (brand plan + npm parity)
        run: |
          pip install requests -q
          python3 .github/scripts/release-request-analyzer.py . || true
          cp RELEASE_REPORT.md /tmp/RELEASE_REPORT.md 2>/dev/null || true
          cp NPM_MISMATCHES.md /tmp/NPM_MISMATCHES.md 2>/dev/null || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: release-request-report
          path: |
            RELEASE_REPORT.md
            NPM_MISMATCHES.md

      - name: Detect npm parity mismatch
        id: parity
        run: |
          if grep -q "BEHIND\|MISSING" RELEASE_REPORT.md 2>/dev/null; then
            echo "MISMATCH=true" >> $GITHUB_OUTPUT
          else
            echo "MISMATCH=false" >> $GITHUB_OUTPUT
          fi

      - name: Open/update npm-parity Discussion
        if: steps.parity.outputs.MISMATCH == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const mismatches = fs.readFileSync('NPM_MISMATCHES.md', 'utf8');
            const title = 'release-request: npm parity updates needed';
            const { owner, repo } = context.repo;
            const q = `repo:${owner}/${repo} ${title} in:title`;
            const { data } = await github.rest.graphql(
              `query($q: String!) { search(query: $q, type: DISCUSSIONS, first: 5) { nodes { ... on Discussion { id number } } } }`,
              { q });
            const existing = data.search.nodes && data.search.nodes[0];
            const body = `## 📦 npm parity mismatches\n\nThe hermes and nastech npm packages do not match. Below is exactly how to update and publish each one.\n\n${mismatches}\n\nAfter fixing, set \`npm publish: yes\` in RELEASE_REQUEST.md and run the \`Publish npm updates\` workflow (requires \`NPM_TOKEN\`).`;
            if (existing) {
              await github.rest.graphql(
                `mutation($id: ID!, $b: String!) { updateDiscussion(input: { discussionId: $id, body: $b }) { discussion { number } } }`,
                { id: existing.id, b: body });
              core.notice(`Updated Discussion #${existing.number}`);
            } else {
              const created = await github.rest.graphql(
                `mutation($r: ID!, $t: String!, $b: String!) { createDiscussion(input: { repositoryId: $r, title: $t, body: $b }) { discussion { number } } }`,
                { r: context.payload.repository.node_id, t: title, b: body });
              core.notice(`Created Discussion #${created.createDiscussion.discussion.number}`);
            }

      - name: Telegram — release request analysed
        shell: bash
        run: |
          python3 .github/scripts/telegram_notify.py \
            --token "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --chat "${{ secrets.TELEGRAM_CHAT_ID }}" \
            --event release-request \
            --title "${{ steps.parity.outputs.MISMATCH == 'true' && '📦 npm parity mismatch — update needed' || '✅ Release request analysed — parity OK' }}" \
            --level "${{ steps.parity.outputs.MISMATCH == 'true' && 'warn' || 'success' }}" \
            --body "RELEASE_REQUEST.md brand plan re-read. npm parity: ${{ steps.parity.outputs.MISMATCH == 'true' && 'MISMATCH (see Discussion)' || 'OK' }}." \
            --file /tmp/NPM_MISMATCHES.md || true

      - name: Parity OK (no discussion, no spam)
        if: steps.parity.outputs.MISMATCH == 'false'
        run: echo "All nastech npm packages match their hermes parity versions."
