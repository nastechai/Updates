name: "Stage 4: Semi-Stage to Final"

on:
  push:
    branches:
      - semi-stage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Semi-Stage branch
        uses: actions/checkout@v4
        with:
          ref: semi-stage
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Run Orchestrator (Final Stage)
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py .github/scripts/*.js
          ./.github/scripts/branding-orchestrator.sh . final
          
      - name: Commit and Push to Final
        run: |
          git checkout -B final
          git add -A
          git commit -m "chore: final branding transformation and verification" || echo "No changes to commit"
          git push origin final --force

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: STAGE_REPORT.md
