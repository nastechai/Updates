name: "Stage 4: Final → Production PR (nastech-agent)"

on:
  push:
    branches:
      - final
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  orchestrate-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: final
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Run Orchestrator (Final Stage)
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py .github/scripts/*.js 2>/dev/null || true
          ./.github/scripts/branding-orchestrator.sh . final

      - name: Commit final artifacts
        run: |
          git add -A
          git commit -m "chore(stage4): final branding transformation and verification [auto]" || echo "Nothing to commit"
          git push origin final

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: STAGE_REPORT.md

  create-production-pr:
    needs: orchestrate-final
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final
        uses: actions/checkout@v4
        with:
          ref: final
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create PR to nastechai/nastech-agent
        uses: actions/github-script@v7
        env:
          NAS_TOKEN: ${{ secrets.NAS_TOKEN }}
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const targetOwner = 'nastechai';
            const targetRepo = 'nastech-agent';

            const fs = require('fs');
            let reportBody = '## NasTech Branding Pipeline — Final Stage Report\n\n';
            if (fs.existsSync('STAGE_REPORT.md')) {
              reportBody += fs.readFileSync('STAGE_REPORT.md', 'utf8');
            } else {
              reportBody += '_No detailed report found._';
            }

            // NOTE: main in nastechai/Updates is NEVER the target.
            // This PR goes to nastechai/nastech-agent main only.
            try {
              const pr = await github.rest.pulls.create({
                owner: targetOwner,
                repo: targetRepo,
                title: `chore: sync and rebrand from Hermes (${new Date().toISOString().split('T')[0]})`,
                head: `${owner}:final`,
                base: 'main',
                body: reportBody
              });
              console.log(`Production PR created: ${pr.data.html_url}`);
            } catch (error) {
              console.log(`Failed to create production PR: ${error.message}`);
              await github.rest.issues.create({
                owner,
                repo,
                title: '🚨 Production PR Stage Failed',
                body: `Failed to create PR to ${targetOwner}/${targetRepo}.\n\nError: ${error.message}\n\n${reportBody}`
              });
            }
