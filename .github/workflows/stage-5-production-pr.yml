name: "Stage 5: Production PR"

on:
  push:
    branches:
      - final
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  production-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Final branch
        uses: actions/checkout@v4
        with:
          ref: final
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create PR to nastech-agent
        uses: actions/github-script@v7
        env:
          NAS_TOKEN: ${{ secrets.NAS_TOKEN }}
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const targetOwner = 'nastechai';
            const targetRepo = 'nastech-agent';
            
            // Generate report content for PR body
            const fs = require('fs');
            let reportBody = '## NasTech Branding Pipeline - Final Report\n\n';
            if (fs.existsSync('STAGE_REPORT.md')) {
              reportBody += fs.readFileSync('STAGE_REPORT.md', 'utf8');
            } else {
              reportBody += 'No detailed report found.';
            }

            try {
              const pr = await github.rest.pulls.create({
                owner: targetOwner,
                repo: targetRepo,
                title: `chore: sync and rebrand from Hermes (${new Date().toISOString().split('T')[0]})`,
                head: `${owner}:final`,
                base: 'main',
                body: reportBody
              });
              console.log(`PR created: ${pr.data.html_url}`);
            } catch (error) {
              console.log(`Failed to create PR: ${error.message}`);
              // If PR already exists or other error, create an issue in Updates repo
              await github.rest.issues.create({
                owner,
                repo,
                title: '🚨 Production PR Stage Failed',
                body: `Failed to create PR to ${targetOwner}/${targetRepo}. Error: ${error.message}\n\n${reportBody}`
              });
            }
