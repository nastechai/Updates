name: "NasTech: Sync from nastechai/nastech-agent"

# This workflow runs on the `nastech` branch only.
# It syncs the latest code from nastechai/nastech-agent into the
# `nastech` branch of this repo, then opens a PR into hermes-automation
# to feed the pipeline. main is NEVER touched.

on:
  schedule:
    # Daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-nastech:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nastech branch
        uses: actions/checkout@v4
        with:
          ref: nastech
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Add nastechai/nastech-agent as upstream
        run: |
          git remote add nastech-upstream https://github.com/nastechai/nastech-agent.git || true
          git fetch nastech-upstream main

      - name: Merge upstream into nastech branch
        run: |
          git merge nastech-upstream/main --no-ff \
            -m "chore(nastech-sync): merge from nastechai/nastech-agent [auto]" \
            --allow-unrelated-histories || true
          git push origin nastech

      - name: Open PR nastech → hermes-automation (pipeline entry)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = 'nastech';
            const base = 'hermes-automation';

            const prs = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${head}`, base, state: 'open'
            });

            if (prs.data.length > 0) {
              console.log(`PR already open: ${prs.data[0].html_url}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner, repo,
              title: `chore(nastech-sync): nastech → hermes-automation [auto]`,
              head,
              base,
              body: `## NasTech Upstream Sync\n\nLatest changes from \`nastechai/nastech-agent\` merged into \`nastech\`.\nThis PR feeds the pipeline: \`hermes-automation → verify → semi-stage → final\`.\n\n> **main is never touched.**`,
            });
            console.log(`PR created: ${pr.data.html_url}`);

            // Auto-merge into hermes-automation
            try {
              await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.data.number,
                merge_method: 'squash',
                commit_title: `chore(nastech-sync): nastech → hermes-automation [auto-merge]`
              });
              console.log('Auto-merged into hermes-automation');
            } catch (e) {
              console.log(`Auto-merge skipped: ${e.message}`);
            }
