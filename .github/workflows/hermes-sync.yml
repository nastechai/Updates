name: "Hermes Sync → hermes-upstream (always up to date)"

# Pulls the latest code from NousResearch/hermes-agent into the
# `hermes-upstream` branch of this repo. hermes-upstream is the ALWAYS
# up-to-date mirror that the pipeline's bots pull fixes from. Only pushes
# when there are new commits (no spam), then triggers the ordered pipeline.

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-hermes-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hermes-upstream
        uses: actions/checkout@v7
        with:
          ref: hermes-upstream
          fetch-depth: 0
          token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "NasTech Sync Bot"
          git config user.email "sync@nastechai.dev"

      - name: Fetch NousResearch/hermes-agent
        run: |
          git remote add hermes-upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch hermes-upstream main

      - name: Detect new commits (stop quietly if none)
        id: detect
        run: |
          PREV=$(git rev-parse HEAD)
          NEW=$(git rev-parse hermes-upstream/main)
          echo "PREV_SHA=$PREV" >> $GITHUB_OUTPUT
          echo "NEW_SHA=$NEW" >> $GITHUB_OUTPUT
          if [ "$PREV" = "$NEW" ]; then
            echo "NO_CHANGE=true" >> $GITHUB_OUTPUT
          else
            echo "NO_CHANGE=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream and generate incoming report
        if: steps.detect.outputs.NO_CHANGE == 'false'
        run: |
          git merge hermes-upstream/main --no-ff \
            -m "chore(hermes-sync): merge NousResearch/hermes-agent [auto]" \
            --allow-unrelated-histories || true
          python3 .github/scripts/incoming_report.py \
            --repo . \
            --from-ref "${{ steps.detect.outputs.PREV_SHA }}" \
            --to-ref "${{ steps.detect.outputs.NEW_SHA }}" \
            --branch hermes-upstream
          git add INCOMING_REPORT.md
          git commit -m "chore(hermes-sync): incoming report [auto]" || true
          git push origin hermes-upstream

      - name: Telegram — new commits on hermes-upstream
        if: steps.detect.outputs.NO_CHANGE == 'false'
        shell: bash
        run: |
          python3 .github/scripts/telegram_notify.py \
            --token "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --chat "${{ secrets.TELEGRAM_CHAT_ID }}" \
            --event new-commit \
            --title "📥 New commits on hermes-upstream" \
            --level "info" \
            --body "NousResearch/hermes-agent has new code. Merged into hermes-upstream and triggering the ordered pipeline." \
            --file INCOMING_REPORT.md || true

      - name: Trigger ordered stage pipeline
        if: steps.detect.outputs.NO_CHANGE == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NAS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'stage-pipeline.yml',
              ref: 'main',
            });

      - name: No new commits
        if: steps.detect.outputs.NO_CHANGE == 'true'
        run: echo "hermes-upstream already current — nothing to do (no notification sent)."
