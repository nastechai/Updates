name: Verify Branding (PR)

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.env.example'
      - '**/*.json'
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.md'
      - '**/*.sh'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  verify-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run verification script
        id: verify
        continue-on-error: true
        run: |
          chmod +x .github/scripts/verify-branding.sh
          .github/scripts/verify-branding.sh . || true

      - name: Check for Hermes references
        id: check-hermes
        continue-on-error: true
        run: |
          HERMES_COUNT=$(find . -type f \( -name "*.json" -o -name "*.py" -o -name "*.js" -o -name "*.ts" -o -name "*.md" \) \
            -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./.venv/*" \
            -exec grep -l "hermes-agent\|Hermes Agent" {} \; 2>/dev/null | wc -l)
          
          if [ "$HERMES_COUNT" -gt 0 ]; then
            echo "hermes_found=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "hermes_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for @nous-research
        id: check-nous
        continue-on-error: true
        run: |
          NOUS_COUNT=$(find . -type f -name "package.json" \
            -not -path "./.git/*" -not -path "./node_modules/*" \
            -exec grep -l "@nous-research" {} \; 2>/dev/null | wc -l)
          
          if [ "$NOUS_COUNT" -gt 0 ]; then
            echo "nous_found=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "nous_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for nousresearch Docker
        id: check-docker
        continue-on-error: true
        run: |
          DOCKER_COUNT=$(find . -type f \( -name "Dockerfile*" -o -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./.git/*" \
            -exec grep -l "nousresearch/hermes" {} \; 2>/dev/null | wc -l)
          
          if [ "$DOCKER_COUNT" -gt 0 ]; then
            echo "docker_found=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "docker_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checks = [
              { 
                name: 'Hermes references', 
                passed: '${{ steps.check-hermes.outcome }}' === 'success',
                icon: '${{ steps.check-hermes.outcome }}' === 'success' ? '✓' : '✗'
              },
              { 
                name: '@nous-research references', 
                passed: '${{ steps.check-nous.outcome }}' === 'success',
                icon: '${{ steps.check-nous.outcome }}' === 'success' ? '✓' : '✗'
              },
              { 
                name: 'nousresearch Docker references', 
                passed: '${{ steps.check-docker.outcome }}' === 'success',
                icon: '${{ steps.check-docker.outcome }}' === 'success' ? '✓' : '✗'
              }
            ];

            const passed = checks.filter(c => c.passed).length;
            const total = checks.length;

            let comment = `## 🔍 Branding Verification Report\n\n`;
            comment += `**Result:** ${passed}/${total} checks passed\n\n`;
            comment += `| Check | Status |\n`;
            comment += `|-------|--------|\n`;

            checks.forEach(check => {
              const status = check.passed ? '✓ PASS' : '✗ FAIL';
              comment += `| ${check.name} | ${status} |\n`;
            });

            if (passed === total) {
              comment += `\n✅ **All branding checks passed!** This PR is ready for merge.`;
            } else {
              comment += `\n❌ **Some branding checks failed.** Please review the issues above.`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if checks failed
        if: |
          steps.check-hermes.outcome == 'failure' ||
          steps.check-nous.outcome == 'failure' ||
          steps.check-docker.outcome == 'failure'
        run: |
          echo "❌ Branding verification failed"
          exit 1
