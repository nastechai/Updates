name: "Main Branch Isolation Guard"

# This workflow runs on every PR targeting main.
# It BLOCKS merges from any pipeline branch (hermes-automation, verify,
# semi-stage, final, sync/*, nastech, setup-automation).
# Only direct system/admin commits are allowed on main.

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  block-pipeline-merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        id: check
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "Source branch: $SOURCE"

          # Block all pipeline and sync branches from merging into main
          BLOCKED_PATTERNS=("hermes-automation" "verify" "semi-stage" "final" "nastech" "setup-automation" "sync/")

          for pattern in "${BLOCKED_PATTERNS[@]}"; do
            if [[ "$SOURCE" == *"$pattern"* ]]; then
              echo "BLOCKED=true" >> $GITHUB_OUTPUT
              echo "REASON=Branch '$SOURCE' is a pipeline branch and must never merge into main." >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "BLOCKED=false" >> $GITHUB_OUTPUT

      - name: Comment and fail if blocked
        if: steps.check.outputs.BLOCKED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚫 Main Branch Isolation Guard\n\n**This PR is blocked.**\n\n\`main\` is a system-only branch and must never receive merges from pipeline branches (\`hermes-automation\`, \`verify\`, \`semi-stage\`, \`final\`, \`nastech\`, \`sync/*\`).\n\nThe pipeline flow is:\n\`\`\`\nhermes-automation → verify → semi-stage → final → nastechai/nastech-agent\n\`\`\`\n\n\`main\` in this repository is never part of that flow. Please close this PR.`
            });

      - name: Fail the check
        if: steps.check.outputs.BLOCKED == 'true'
        run: |
          echo "::error::${{ steps.check.outputs.REASON }}"
          exit 1

      - name: Pass for legitimate system PRs
        if: steps.check.outputs.BLOCKED == 'false'
        run: echo "Source branch is not a pipeline branch. Proceeding."
