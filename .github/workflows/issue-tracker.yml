name: Sync Status Tracker

on:
  workflow_run:
    workflows: ["Auto Sync Test Rebrand PR"]
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  track-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Create issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            const runId = ${{ github.event.workflow_run.id }};
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync Status: ${conclusion.toUpperCase()}`,
              body: `The sync workflow finished with status: ${conclusion}. Run details: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`
            });
